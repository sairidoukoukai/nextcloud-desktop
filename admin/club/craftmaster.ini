[General]
Branch = stable-35.0-qt-6.11.2
CraftUrl = https://github.com/nextcloud/craft.git
CraftRevision = a35a7cc53b3a06609081c1227156d4d59963927f
ShallowClone = False

# Variables defined here override the default value
# The variable names are casesensitive
[Variables]
#Values need to be overwritten to create a cache
UseCache = True
CreateCache = False

# Settings applicable for all Crafts matrices
# Settings are Category/key=value
# Category is case sensitive
[GeneralSettings]

General/MacDeploymentTarget = 13.0

Compile/BuildType = RelWithDebInfo

Compile/UseNinja = True
Compile/Jobs = 4

ShortPath/Enabled = False
ShortPath/EnableJunctions = False

Packager/RepositoryUrl = https://download.nextcloud.com/desktop/development/craftCache/
Packager/CacheVersion = stable-35.0-qt-6.11.2
ContinuousIntegration/Enabled = True

Packager/UseCache = ${Variables:UseCache}
Packager/CreateCache = ${Variables:CreateCache}
Packager/CacheDir = ${Variables:Root}\cache

[BlueprintSettings]
craft/craft-core.revision = a35a7cc53b3a06609081c1227156d4d59963927f
nextcloud-client.buildTests = True
nextcloud-client.buildWithWebEngine = False
binary/mysql.useMariaDB = False
libs/qt6.version = 6.11.2
craft/craft-blueprints-kde.revision = d09c61abb67d3a1b219010d64f9139fea68694fe
craft/craft-blueprints-nextcloud.revision = d9829275a569d3cf83e42ad9c50140074d01dd9f

[windows-msvc2022_64-cl]
Packager/PackageType = NullsoftInstallerPackager
QtSDK/Compiler = msvc2022_64
General/ABI = windows-msvc2022_64-cl
Paths/Python = C:\Python312-x64

[Env]
CRAFT_CODESIGN_CERTIFICATE =
