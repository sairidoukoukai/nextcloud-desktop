name: Sairibus Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (v35.0.0-sairibus.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: club-windows-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suffix: ${{ steps.source.outputs.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate merged source and unused tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          export TAG_REFS="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG")"
          python3 admin/club/release.py validate
          python3 -m unittest discover -s admin/club/tests -v

  windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      MAIN_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build, test, package and install smoke test
        shell: pwsh
        run: ./admin/club/build-windows.ps1
      - name: Write checksums and source metadata
        shell: pwsh
        run: python admin/club/release.py checksums artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: |
            artifacts/Nextcloud-35.0.0-${{ needs.validate.outputs.suffix }}-windows-x64.exe
            artifacts/build-info.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: windows-x64
          path: artifacts
      - name: Recheck main and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          export TAG_REFS="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG")"
          python3 admin/club/release.py validate
          (cd artifacts && sha256sum --check SHA256SUMS)
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          info = json.loads(Path('artifacts/build-info.json').read_text())
          assert info['source_commit'] == os.environ['GITHUB_SHA']
          assert info['release_tag'] == os.environ['RELEASE_TAG']
          notes = f"""Unofficial Nextcloud Desktop 35.0.0 with Cloudflare Access Service Token support.

          Windows x64 installer. This preview is unsigned. Automatic updates from the official Nextcloud channel are disabled.

          Source commit: `{info['source_commit']}`. Nine focused client test suites passed on the GitHub Windows runner. A silent installation check verified the executable and sync libraries against the tested build, plus the Start Menu launcher target. GUI startup and synchronization with the production server have not been tested by this workflow.

          Configure a separate Cloudflare Service Token for each device, then complete the normal Nextcloud browser login. Server-side device authorization is required. macOS File Provider is unsupported.

          Verify the download against `SHA256SUMS`. `build-info.json` records the exact source commit. Complete GPL source is available from this release's source archives.
          """
          Path('release-notes.md').write_text(notes)
          PYTHON
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path('tag.json').write_text(json.dumps({'ref': 'refs/tags/' + os.environ['RELEASE_TAG'], 'sha': os.environ['GITHUB_SHA']}))
          PYTHON
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input tag.json > /dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" "artifacts/Nextcloud-${RELEASE_TAG#v}-windows-x64.exe" artifacts/build-info.json artifacts/SHA256SUMS --verify-tag \
            --title "Nextcloud $RELEASE_TAG — Sairibus preview" \
            --notes-file release-notes.md --prerelease --latest=false
