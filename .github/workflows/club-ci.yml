name: Sairibus CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: club-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-scripts:
    name: Release script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s admin/club/tests -v

  windows:
    name: Windows build
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CLUB_VERSION_SUFFIX: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build, test, package and install smoke test
        shell: pwsh
        run: ./admin/club/build-windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-ci
          path: artifacts/*-windows-x64.exe
          if-no-files-found: error
          retention-days: 7
